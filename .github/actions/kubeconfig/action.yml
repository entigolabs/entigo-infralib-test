name: Kubeconfig for the environments' clusters
description: >
  The executor builds the kubeconfig; the framework picks the context the
  cloud CLI gives each environment's cluster. Reads the environments through
  the repository's test.sh, so it runs after the clusters exist (after the
  agent). EKS, GKE and OKE are covered. The OKE context is renamed to the
  cluster name, since oci names it after the cluster OCID.
inputs:
  environments:
    description: comma separated environment names; empty means all
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      env:
        ENVIRONMENTS: ${{ inputs.environments }}
      run: |
        set -euo pipefail
        # gcloud and oci run from the test images: the runner has no oci, and
        # the gcloud configuration was written by the image's gcloud (see the
        # credentials action). Config directories are mounted at their own
        # paths (key_file= in the oci config is absolute) and so is the
        # kubeconfig; kubectl on the runner then renames the OKE context.
        version=$(grep -oE 'INFRALIB_TEST_VERSION:-v[0-9.]+' test.sh 2>/dev/null | cut -d- -f2 || true)
        kube="${KUBECONFIG:-$HOME/.kube/config}"
        mkdir -p "$(dirname "$kube")"
        gcloud() {
          local cfg="${CLOUDSDK_CONFIG:-$HOME/.config/gcloud}"
          docker run --rm --entrypoint gcloud --user "$(id -u):$(id -g)" -e KUBECONFIG="$kube" -e CLOUDSDK_CONFIG="$cfg" \
            -v "$(dirname "$kube")":"$(dirname "$kube")" -v "$cfg":"$cfg" \
            "entigolabs/entigo-infralib-test-google:${version:-latest}" "$@"
        }
        oci() {
          local config="${OCI_CONFIG_FILE:-$HOME/.oci/config}"
          docker run --rm --entrypoint oci --user "$(id -u):$(id -g)" -e KUBECONFIG="$kube" \
            -v "$(dirname "$config")":"$(dirname "$config")":ro -e OCI_CONFIG_FILE="$config" \
            -v "$(dirname "$kube")":"$(dirname "$kube")" \
            "entigolabs/entigo-infralib-test-oracle:${version:-latest}" "$@"
        }
        # awk keeps empty columns apart; bash's read would collapse the tabs
        # around an empty zone or project and shift the cluster column.
        ./test.sh envs --tsv | awk -F'\t' -v OFS='\t' '{print $1, $2, $8}' | while IFS=$'\t' read -r name cloud cluster; do
          if [ -n "${ENVIRONMENTS}" ]; then
            case ",${ENVIRONMENTS}," in *",${name},"*) ;; *) continue ;; esac
          fi
          [ -n "$cluster" ] || continue
          # A cluster that does not exist (yet) is a warning, not a failure:
          # terraform module tests need no cluster, and a k8s test that does
          # fails on its own with the command that would have created the
          # context.
          case "$cloud" in
            aws)
              [ -n "${AWS_ACCESS_KEY_ID:-}" ] || continue
              aws eks update-kubeconfig --region "${AWS_REGION}" --name "$cluster" \
                || echo "::warning::no kubeconfig for $name: cluster $cluster is not available" ;;
            google)
              [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ] || continue
              gcloud container clusters get-credentials "$cluster" --region "${GOOGLE_REGION}" --project "${GOOGLE_PROJECT}" \
                || echo "::warning::no kubeconfig for $name: cluster $cluster is not available" ;;
            oracle)
              [ -n "${OCI_COMPARTMENT_ID:-}" ] && [ -f "${OCI_CONFIG_FILE:-$HOME/.oci/config}" ] || continue
              id=$(oci ce cluster list --compartment-id "${OCI_COMPARTMENT_ID}" --region "${OCI_REGION}" --name "$cluster" --lifecycle-state ACTIVE --query 'data[0].id' --raw-output 2>/dev/null || true)
              if [ -z "$id" ] || [ "$id" = null ]; then echo "::warning::no kubeconfig for $name: cluster $cluster is not available"; continue; fi
              oci ce cluster create-kubeconfig --cluster-id "$id" --region "${OCI_REGION}" --file "$kube" \
                --token-version 2.0.0 --kube-endpoint PUBLIC_ENDPOINT \
                && kubectl config rename-context "context-c${id: -11}" "$cluster" \
                || echo "::warning::no kubeconfig for $name: cluster $cluster is not available" ;;
          esac
        done
