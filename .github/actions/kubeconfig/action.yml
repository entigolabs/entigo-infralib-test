name: Kubeconfig for the environments' clusters
description: >
  The orchestrator builds the kubeconfig (./test.sh kubeconfig) with shackle
  (https://github.com/entigolabs/shackle) from the cli image, which every run
  has pulled already: one static binary for every cloud, so no cloud CLI and
  no cloud image is needed for it. Runs after the clusters exist (after the
  agent). EKS, GKE, OKE and AKS are covered. The contexts land in
  .infralib-test/kubeconfig, where the test containers pick them up; every
  context gets the name the cloud's own CLI would give it (OKE: the cluster
  name), and its user runs `shackle token <cloud>`, which the images have.
inputs:
  environments:
    description: comma separated environment names; empty means all
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      env:
        ENVIRONMENTS: ${{ inputs.environments }}
      run: |
        set -euo pipefail
        args=()
        IFS=, read -r -a envs <<<"${ENVIRONMENTS}"
        for e in "${envs[@]}"; do [ -n "$e" ] && args+=(--env "$e"); done
        ./test.sh kubeconfig "${args[@]}"
