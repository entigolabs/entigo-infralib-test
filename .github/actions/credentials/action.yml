name: Cloud credentials
description: >
  Turns the credential secrets a module repository provides into what the
  orchestrator reads: Google and Oracle credential files on disk. AWS needs
  nothing beyond the AWS_* environment variables the caller already set, and
  Azure nothing beyond AZURE_*: the SDKs, the agent and kubelogin read the
  service principal from them, and the kubeconfig action logs az in itself.
  Inputs are the secrets' values, passed through by the calling workflow, and
  optionally the environments the job is for: only their clouds are prepared,
  so a job for one environment, or a pull request of a module that some
  environments install, does not activate Google or write the Oracle
  configuration for clouds it never touches. Reads the environments through
  the repository's test.sh.
inputs:
  google_credentials:
    description: Google service account key JSON (GOOGLE_CREDENTIALS)
    default: ''
  oci_config:
    description: Oracle ~/.oci/config content (OCI_CONFIG)
    default: ''
  oci_private_key:
    description: Oracle API key PEM (OCI_PRIVATE_KEY)
    default: ''
  environments:
    description: comma separated environment names whose clouds to prepare; empty means every cloud
    default: ''
runs:
  using: composite
  steps:
    - name: Clouds of the environments
      id: clouds
      shell: bash
      env:
        ENVIRONMENTS: ${{ inputs.environments }}
      run: |
        set -euo pipefail
        if [ -z "${ENVIRONMENTS}" ]; then
          echo "clouds=aws,google,oracle,azure" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        clouds=$(./test.sh envs --tsv | awk -F'\t' -v envs=",${ENVIRONMENTS}," 'index(envs, "," $1 ",") {print $2}' | sort -u | paste -sd,)
        echo "Clouds of ${ENVIRONMENTS}: ${clouds:-none}"
        echo "clouds=${clouds}" >> "$GITHUB_OUTPUT"
    - name: Google credentials
      # The gcloud configuration is written by the gcloud of the google test
      # image, which is the one that reads it later: the agent's pipeline
      # scripts run gsutil inside that image as user 1000, and a configuration
      # the runner's own gcloud wrote (another version, another user, mode
      # 0700) left gsutil with invalid credentials.
      if: inputs.google_credentials != '' && contains(format(',{0},', steps.clouds.outputs.clouds), ',google,')
      shell: bash
      env:
        GOOGLE_CREDENTIALS: ${{ inputs.google_credentials }}
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/gcloud"
        echo "${GOOGLE_CREDENTIALS}" > "${RUNNER_TEMP}/gcloud/google.json"
        chmod -R a+rwX "${RUNNER_TEMP}/gcloud"
        version=$(grep -oE 'INFRALIB_TEST_VERSION:-v[0-9.]+' test.sh 2>/dev/null | cut -d- -f2 || true)
        docker run --rm --entrypoint sh --user "$(id -u):$(id -g)" -e CLOUDSDK_CONFIG=/creds/gcloud \
          -v "${RUNNER_TEMP}/gcloud":/creds/gcloud "entigolabs/entigo-infralib-test-google:${version:-latest}" \
          -c 'gcloud auth activate-service-account --key-file /creds/gcloud/google.json --quiet'
        chmod -R a+rwX "${RUNNER_TEMP}/gcloud"
        {
          echo "CLOUDSDK_CONFIG=${RUNNER_TEMP}/gcloud"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/gcloud/google.json"
        } >> "$GITHUB_ENV"
    - name: Oracle credentials
      if: inputs.oci_config != '' && contains(format(',{0},', steps.clouds.outputs.clouds), ',oracle,')
      shell: bash
      env:
        OCI_CONFIG: ${{ inputs.oci_config }}
        OCI_PRIVATE_KEY: ${{ inputs.oci_private_key }}
      run: |
        mkdir -p ~/.oci
        echo "${OCI_CONFIG}" > ~/.oci/config
        echo "${OCI_PRIVATE_KEY}" > ~/.oci/oci_api_key.pem
        # The config is read inside containers whose HOME is not the runner's,
        # with ~/.oci mounted at its absolute path; a key_file written with a
        # tilde (as the OCI console suggests) would point nowhere there. The
        # key is the one written above, whatever the config calls it.
        sed -i -E "s#^(key_file *= *).*#\\1$HOME/.oci/oci_api_key.pem#" ~/.oci/config
        grep -q '^key_file' ~/.oci/config || echo "key_file=$HOME/.oci/oci_api_key.pem" >> ~/.oci/config
        chmod 600 ~/.oci/config ~/.oci/oci_api_key.pem
