name: Cloud credentials
description: >
  Turns the credential secrets a module repository provides into what the
  orchestrator reads: Google and Oracle credential files on disk, an az login
  for Azure. AWS needs nothing beyond the AWS_* environment variables the
  caller already set, and the Azure SDKs read AZURE_* the same way.
  Inputs are the secrets' values, passed through by the calling workflow.
inputs:
  google_credentials:
    description: Google service account key JSON (GOOGLE_CREDENTIALS)
    default: ''
  oci_config:
    description: Oracle ~/.oci/config content (OCI_CONFIG)
    default: ''
  oci_private_key:
    description: Oracle API key PEM (OCI_PRIVATE_KEY)
    default: ''
  azure_tenant_id:
    description: Azure tenant of the service principal (AZURE_TENANT_ID)
    default: ''
  azure_subscription_id:
    description: Azure subscription (AZURE_SUBSCRIPTION_ID)
    default: ''
  azure_client_id:
    description: Azure service principal application id (AZURE_CLIENT_ID)
    default: ''
  azure_client_secret:
    description: Azure service principal secret (AZURE_CLIENT_SECRET)
    default: ''
runs:
  using: composite
  steps:
    - name: Google credentials
      # The gcloud configuration is written by the gcloud of the google test
      # image, which is the one that reads it later: the agent's pipeline
      # scripts run gsutil inside that image as user 1000, and a configuration
      # the runner's own gcloud wrote (another version, another user, mode
      # 0700) left gsutil with invalid credentials.
      if: inputs.google_credentials != ''
      shell: bash
      env:
        GOOGLE_CREDENTIALS: ${{ inputs.google_credentials }}
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/gcloud"
        echo "${GOOGLE_CREDENTIALS}" > "${RUNNER_TEMP}/gcloud/google.json"
        chmod -R a+rwX "${RUNNER_TEMP}/gcloud"
        version=$(grep -oE 'INFRALIB_TEST_VERSION:-v[0-9.]+' test.sh 2>/dev/null | cut -d- -f2 || true)
        docker run --rm --entrypoint sh --user "$(id -u):$(id -g)" -e CLOUDSDK_CONFIG=/creds/gcloud \
          -v "${RUNNER_TEMP}/gcloud":/creds/gcloud "entigolabs/entigo-infralib-test-google:${version:-latest}" \
          -c 'gcloud auth activate-service-account --key-file /creds/gcloud/google.json --quiet'
        chmod -R a+rwX "${RUNNER_TEMP}/gcloud"
        {
          echo "CLOUDSDK_CONFIG=${RUNNER_TEMP}/gcloud"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/gcloud/google.json"
        } >> "$GITHUB_ENV"
    - name: Oracle credentials
      if: inputs.oci_config != ''
      shell: bash
      env:
        OCI_CONFIG: ${{ inputs.oci_config }}
        OCI_PRIVATE_KEY: ${{ inputs.oci_private_key }}
      run: |
        mkdir -p ~/.oci
        echo "${OCI_CONFIG}" > ~/.oci/config
        echo "${OCI_PRIVATE_KEY}" > ~/.oci/oci_api_key.pem
        chmod 600 ~/.oci/config ~/.oci/oci_api_key.pem
    - name: Azure credentials
      # The az login is done by the az of the azure test image into a
      # configuration directory of its own, like gcloud's: the kubeconfig
      # action runs az from that image to fetch AKS credentials. The service
      # principal itself stays in the AZURE_* variables for the SDKs, the
      # agent and kubelogin.
      if: inputs.azure_client_secret != ''
      shell: bash
      env:
        AZURE_TENANT_ID: ${{ inputs.azure_tenant_id }}
        AZURE_SUBSCRIPTION_ID: ${{ inputs.azure_subscription_id }}
        AZURE_CLIENT_ID: ${{ inputs.azure_client_id }}
        AZURE_CLIENT_SECRET: ${{ inputs.azure_client_secret }}
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/azure"
        chmod -R a+rwX "${RUNNER_TEMP}/azure"
        version=$(grep -oE 'INFRALIB_TEST_VERSION:-v[0-9.]+' test.sh 2>/dev/null | cut -d- -f2 || true)
        docker run --rm --entrypoint sh --user "$(id -u):$(id -g)" -e AZURE_CONFIG_DIR=/creds/azure \
          -e AZURE_TENANT_ID -e AZURE_SUBSCRIPTION_ID -e AZURE_CLIENT_ID -e AZURE_CLIENT_SECRET \
          -v "${RUNNER_TEMP}/azure":/creds/azure "entigolabs/entigo-infralib-test-azure:${version:-latest}" \
          -c 'az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID" --output none && az account set --subscription "$AZURE_SUBSCRIPTION_ID"'
        chmod -R a+rwX "${RUNNER_TEMP}/azure"
        echo "AZURE_CONFIG_DIR=${RUNNER_TEMP}/azure" >> "$GITHUB_ENV"
