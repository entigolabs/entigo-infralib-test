name: Cloud credentials
description: >
  Turns the credential secrets a module repository provides into what the
  orchestrator reads: Google and Oracle credential files on disk. AWS needs
  nothing beyond the AWS_* environment variables the caller already set.
  Inputs are the secrets' values, passed through by the calling workflow.
inputs:
  google_credentials:
    description: Google service account key JSON (GOOGLE_CREDENTIALS)
    default: ''
  oci_config:
    description: Oracle ~/.oci/config content (OCI_CONFIG)
    default: ''
  oci_private_key:
    description: Oracle API key PEM (OCI_PRIVATE_KEY)
    default: ''
runs:
  using: composite
  steps:
    - name: Google credentials
      # The gcloud configuration is written by the gcloud of the google test
      # image, which is the one that reads it later: the agent's pipeline
      # scripts run gsutil inside that image as user 1000, and a configuration
      # the runner's own gcloud wrote (another version, another user, mode
      # 0700) left gsutil with invalid credentials.
      if: inputs.google_credentials != ''
      shell: bash
      env:
        GOOGLE_CREDENTIALS: ${{ inputs.google_credentials }}
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/gcloud"
        echo "${GOOGLE_CREDENTIALS}" > "${RUNNER_TEMP}/gcloud/google.json"
        chmod -R a+rwX "${RUNNER_TEMP}/gcloud"
        version=$(grep -oE 'INFRALIB_TEST_VERSION:-v[0-9.]+' test.sh 2>/dev/null | cut -d- -f2 || true)
        docker run --rm --entrypoint sh --user "$(id -u):$(id -g)" -e CLOUDSDK_CONFIG=/creds/gcloud \
          -v "${RUNNER_TEMP}/gcloud":/creds/gcloud "entigolabs/entigo-infralib-test-google:${version:-latest}" \
          -c 'gcloud auth activate-service-account --key-file /creds/gcloud/google.json --quiet'
        chmod -R a+rwX "${RUNNER_TEMP}/gcloud"
        {
          echo "CLOUDSDK_CONFIG=${RUNNER_TEMP}/gcloud"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/gcloud/google.json"
        } >> "$GITHUB_ENV"
    - name: Oracle credentials
      if: inputs.oci_config != ''
      shell: bash
      env:
        OCI_CONFIG: ${{ inputs.oci_config }}
        OCI_PRIVATE_KEY: ${{ inputs.oci_private_key }}
      run: |
        mkdir -p ~/.oci
        echo "${OCI_CONFIG}" > ~/.oci/config
        echo "${OCI_PRIVATE_KEY}" > ~/.oci/oci_api_key.pem
        chmod 600 ~/.oci/config ~/.oci/oci_api_key.pem
