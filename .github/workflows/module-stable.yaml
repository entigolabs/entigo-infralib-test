# Reusable workflow for module repositories: provision every environment from
# the latest release, one job per environment, and test it. The final job
# gates on all of them, so a release workflow can follow on its success.
#
#   on:
#     schedule: [{cron: '31 3 * * 1-5'}]
#     workflow_dispatch:
#       inputs:
#         cloud: {type: choice, options: [all, aws, google, oracle, azure], default: all}
#   jobs:
#     stable:
#       uses: entigolabs/entigo-infralib-test/.github/workflows/module-stable.yaml@main
#       with:
#         clouds: ${{ inputs.cloud || '' }}
#         release_repo: https://github.com/<org>/<repo>-release   # optional
#       secrets: inherit
#
# The repository's own modules come from release_repo when given, otherwise
# from the repository itself; either way the agent takes the latest release.
# The tests are those of the repository at its latest release tag, so the
# two match. Credentials as in module-pull-request.yaml. With a
# SLACK_WEBHOOK_URL secret (plus SLACK_USERNAME, SLACK_ICON_EMOJI) a failed
# environment is posted to Slack; without it nothing is posted.
#
# A run limited to some clouds or environments is a partial run: it proves
# nothing about the release as a whole, so it leaves no stable-release
# artifact, and the module-release.yaml run that follows it does nothing.
name: Module stable

on:
  workflow_call:
    inputs:
      release_repo:
        description: optional git URL the releases are published to; the agent source of the repository's modules, default the repository itself
        type: string
        default: ''
      source:
        description: optional agent source for the repository's modules that overrides release_repo, e.g. oci://ghcr.io/<org>/<repo>-release
        type: string
        default: ''

      clouds:
        description: comma separated clouds to run; empty or "all" means every cloud with credentials, anything else makes a partial run
        type: string
        default: ''
      environments:
        description: comma separated environments to run; empty means every environment with credentials, anything else makes a partial run
        type: string
        default: ''
      runs-on:
        type: string
        default: ubuntu-latest

jobs:
  plan:
    name: Environments and release
    runs-on: ${{ inputs.runs-on }}
    outputs:
      environments: ${{ steps.envs.outputs.environments }}
      partial: ${{ steps.envs.outputs.partial }}
      release: ${{ steps.release.outputs.tag }}
    env:
      HAS_AWS: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
      HAS_GOOGLE: ${{ secrets.GOOGLE_CREDENTIALS != '' }}
      HAS_ORACLE: ${{ secrets.OCI_CONFIG != '' }}
      HAS_AZURE: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
    steps:
    - name: Latest release of this repository
      id: release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        tag=$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName 2>/dev/null || true)
        [ -n "$tag" ] || { echo "::error::${GITHUB_REPOSITORY} has no release yet; run the release workflow first" >&2; exit 1; }
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "Latest release: $tag"
    - uses: actions/checkout@v7
      with:
        ref: ${{ steps.release.outputs.tag }}
    - name: Select environments
      id: envs
      env:
        CLOUDS: ${{ inputs.clouds }}
        ENVIRONMENTS: ${{ inputs.environments }}
      run: |
        set -euo pipefail
        # "all" is what a dispatch choice input says for every cloud; a GitHub
        # expression cannot turn it into an empty string (a && '' || b yields b).
        [ "${CLOUDS}" != all ] || CLOUDS=""
        selected=$(./test.sh envs --tsv | while IFS=$'\t' read -r name cloud rest; do
          if [ -n "${CLOUDS}" ]; then
            case ",${CLOUDS}," in *",${cloud},"*) ;; *) continue ;; esac
          fi
          if [ -n "${ENVIRONMENTS}" ]; then
            case ",${ENVIRONMENTS}," in *",${name},"*) ;; *) continue ;; esac
          fi
          case "$cloud" in
            aws) [ "${HAS_AWS}" = true ] && echo "$name" ;;
            google) [ "${HAS_GOOGLE}" = true ] && echo "$name" ;;
            oracle) [ "${HAS_ORACLE}" = true ] && echo "$name" ;;
            azure) [ "${HAS_AZURE}" = true ] && echo "$name" ;;
          esac
        done | jq -r -R -s 'split("\n") | map(select(length > 0)) | map(@json) | join(",")')
        echo "Environments: ${selected}"
        [ -n "${selected}" ] || { echo "::error::no selected environment has credentials" >&2; exit 1; }
        # No braces or brackets in the output: GitHub drops a job output that
        # contains any line of a multi-line secret, and a JSON credentials
        # secret has lines that are just { or }. The job rebuilds the JSON.
        echo "environments=${selected}" >> "$GITHUB_OUTPUT"
        if [ -n "${CLOUDS}${ENVIRONMENTS}" ]; then
          echo "::notice::partial run of ${CLOUDS:-${ENVIRONMENTS}}: no release follows it"
          echo "partial=true" >> "$GITHUB_OUTPUT"
        else
          echo "partial=false" >> "$GITHUB_OUTPUT"
        fi

  environment:
    name: ${{ matrix.environment }}
    needs: plan
    runs-on: ${{ inputs.runs-on }}
    strategy:
      matrix:
        environment: ${{ fromJson(format('[{0}]', needs.plan.outputs.environments)) }}
      fail-fast: false
    env:
      HAS_SLACK: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      GOOGLE_PROJECT: ${{ secrets.GOOGLE_PROJECT }}
      GOOGLE_REGION: ${{ secrets.GOOGLE_REGION }}
      GOOGLE_ZONE: ${{ secrets.GOOGLE_ZONE }}
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ secrets.AZURE_LOCATION }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.plan.outputs.release }}
    - name: Wait for other runs on the shared environments
      uses: softprops/turnstyle@v3
      with:
        abort-after-seconds: 3600
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: entigolabs/entigo-infralib-test/.github/actions/credentials@main
      with:
        google_credentials: ${{ secrets.GOOGLE_CREDENTIALS }}
        oci_config: ${{ secrets.OCI_CONFIG }}
        oci_private_key: ${{ secrets.OCI_PRIVATE_KEY }}
    - name: Provision ${{ matrix.environment }} from release ${{ needs.plan.outputs.release }}
      # The version is pinned to the release under test rather than left to the
      # agent's "latest": deterministic, and it sidesteps the agent checking a
      # module against the version recorded in state when the source changes.
      run: ./test.sh agent --env ${{ matrix.environment }} --source ${{ inputs.source || inputs.release_repo || format('{0}/{1}', github.server_url, github.repository) }} --version ${{ needs.plan.outputs.release }}
    - uses: entigolabs/entigo-infralib-test/.github/actions/kubeconfig@main
      with:
        environments: ${{ matrix.environment }}
    - name: Test ${{ matrix.environment }}
      run: ./test.sh test --env ${{ matrix.environment }}
    - name: Logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: logs-${{ matrix.environment }}
        path: logs/
        if-no-files-found: ignore
    - name: Slack message
      if: failure() && env.HAS_SLACK == 'true'
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_COLOR: failure
        SLACK_MESSAGE: "Fresh installation of latest release failed for ${{ matrix.environment }} in ${{ github.repository }}"
        SLACK_USERNAME: ${{ secrets.SLACK_USERNAME }}
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_ICON_EMOJI: ${{ secrets.SLACK_ICON_EMOJI }}
        SLACK_FOOTER: ""

  stable:
    name: Stable
    needs: [plan, environment]
    runs-on: ${{ inputs.runs-on }}
    env:
      RELEASE: ${{ needs.plan.outputs.release }}
      PARTIAL: ${{ needs.plan.outputs.partial }}
    steps:
    - name: Stable release marker
      # The release workflow that a stable run triggers looks for this
      # artifact in the run; a partial run leaves none, and that release run
      # then does nothing.
      run: |
        if [ "${PARTIAL}" = true ]; then
          echo "Release ${RELEASE} is stable on the selected environments only; no stable-release marker, so no release follows"
        else
          echo "Release ${RELEASE} is stable on every environment"
          echo "${RELEASE}" > stable-release.txt
        fi
    - if: env.PARTIAL != 'true'
      uses: actions/upload-artifact@v7
      with:
        name: stable-release
        path: stable-release.txt
