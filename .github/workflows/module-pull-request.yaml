# Reusable workflow for module repositories: test the modules a pull request
# changed, one at a time, each in a step of its own on the shared
# environments. The steps are left in place: tearing down and recreating
# something like a cluster on every push would be slow and wasteful, and the
# test environments are nuked daily anyway.
#
# A module with pin_step in its test/module.yaml cannot have a branch
# installation (a second external-dns would hide whether the branch's one
# works), so it is applied inside its regular step and name. A module's job
# waits only for the older runs it can collide with: runs of its own branch,
# and for a pinned k8s module the runs testing that same module on any
# branch, since its step is its own. A pinned terraform module runs inside
# its regular step with the step's other modules, so it waits for every
# older run. Pull requests of different modules run alongside each other.
#
# First, a static job per changed module runs scripts/static.sh (tflint;
# helm lint, helm template and kube-score) without credentials; the tests
# wait for all of them, so a lint finding is known before the environments
# are touched and nothing is applied for a pull request that fails lint.
#
# In the module repository:
#
#   on:
#     pull_request:
#       paths: ['modules/**']
#   jobs:
#     test:
#       uses: entigolabs/entigo-infralib-test/.github/workflows/module-pull-request.yaml@main
#       secrets: inherit
#
# Credentials and region settings come from the caller's secrets
# (secrets: inherit): AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION;
# GOOGLE_CREDENTIALS, GOOGLE_PROJECT, GOOGLE_REGION, GOOGLE_ZONE; OCI_CONFIG,
# OCI_PRIVATE_KEY, OCI_REGION, OCI_COMPARTMENT_ID. The clouds whose secrets
# are set are the ones whose environments run, and a module's job prepares
# only the clouds of the environments that install the module.
name: Module pull request

on:
  workflow_call:
    inputs:
      modules:
        description: JSON list of module directories to test; empty means the ones the pull request changed
        type: string
        default: ''
      environments:
        description: comma separated environments to use; empty means every environment with credentials
        type: string
        default: ''
      runs-on:
        type: string
        default: ubuntu-latest

jobs:
  detect:
    name: Detect changed modules
    runs-on: ${{ inputs.runs-on }}
    outputs:
      modules: ${{ steps.set.outputs.modules }}
      any: ${{ steps.set.outputs.any }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Changed files
      id: changed
      if: inputs.modules == '' && github.event_name == 'pull_request'
      uses: tj-actions/changed-files@v47
      with:
        base_sha: ${{ github.event.pull_request.base.sha }}
        sha: ${{ github.event.pull_request.head.sha }}
    - name: Build matrix
      id: set
      env:
        INPUT_MODULES: ${{ inputs.modules }}
        CHANGED: ${{ steps.changed.outputs.all_changed_files }} ${{ steps.changed.outputs.deleted_files }}
      run: |
        set -euo pipefail
        if [ -n "${INPUT_MODULES}" ]; then
          modules="${INPUT_MODULES}"
        else
          # A module is a directory modules/<type>/<name> that still exists and
          # has tests; files directly under modules/<type> and deleted modules drop out.
          modules=$(for f in ${CHANGED}; do
              case "$f" in modules/*/*/*) echo "$f" | cut -d/ -f1-3 ;; esac
            done | sort -u | while read -r m; do
              ls "$m"/test/*_test.go >/dev/null 2>&1 && echo "$m"
            done | jq -R -s -c 'split("\n") | map(select(length > 0))')
        fi
        echo "Modules: ${modules}"
        if [ -z "${modules}" ] || [ "${modules}" = "[]" ]; then
          echo "any=false" >> "$GITHUB_OUTPUT"; echo "modules=" >> "$GITHUB_OUTPUT"
        else
          # No braces or brackets in the output: GitHub drops a job output that
          # contains any line of a multi-line secret, and a JSON credentials
          # secret has lines that are just { or }. The job rebuilds the JSON.
          echo "any=true" >> "$GITHUB_OUTPUT"; echo "modules=$(echo "${modules}" | jq -r 'map(@json) | join(",")')" >> "$GITHUB_OUTPUT"
        fi
        for m in $(echo "${modules:-[]}" | jq -r '.[]'); do
          if [ -f "$m/test/module.yaml" ] && grep -qE '^pin_step:[[:space:]]*true[[:space:]]*$' "$m/test/module.yaml"; then
            echo "$m is pinned to its regular step"
          fi
        done

  static:
    name: static ${{ matrix.module }}
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ${{ inputs.runs-on }}
    strategy:
      matrix:
        module: ${{ fromJson(format('[{0}]', needs.detect.outputs.modules)) }}
      fail-fast: false
    steps:
    - uses: actions/checkout@v7
    - name: Framework scripts
      # The scripts of the framework commit this workflow belongs to
      # (job_workflow_sha; workflow_ref would be the caller's).
      uses: actions/checkout@v7
      with:
        repository: entigolabs/entigo-infralib-test
        ref: ${{ github.job_workflow_sha }}
        path: .infralib-test/framework
    - name: Static checks of ${{ matrix.module }}
      run: .infralib-test/framework/scripts/static.sh ${{ matrix.module }}

  test:
    name: ${{ matrix.module }}
    # After every static check: a module that fails lint is not applied,
    # and neither is another module of the same pull request.
    needs: [detect, static]
    if: needs.detect.outputs.any == 'true'
    runs-on: ${{ inputs.runs-on }}
    strategy:
      matrix:
        module: ${{ fromJson(format('[{0}]', needs.detect.outputs.modules)) }}
      max-parallel: 1
      fail-fast: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      GOOGLE_PROJECT: ${{ secrets.GOOGLE_PROJECT }}
      GOOGLE_REGION: ${{ secrets.GOOGLE_REGION }}
      GOOGLE_ZONE: ${{ secrets.GOOGLE_ZONE }}
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ secrets.AZURE_LOCATION }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
    - uses: actions/checkout@v7
    - name: Wait for older runs this one can collide with
      # Runs of the same branch share their per-branch steps, so they go one
      # after the other. A pinned k8s module is applied to the shared
      # installation in a step of its own, so its job also waits for older
      # runs that test the same module on any branch, and for nothing else:
      # a pull request of another module runs alongside. A pinned terraform
      # module is applied inside its regular step with the step's other
      # modules, so it waits for every older run. An older run whose
      # modules are not known yet (its detect job still running) is waited
      # for until they are. Gives up after an hour, like the whole-environment
      # waits of the other workflows.
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        MODULE: ${{ matrix.module }}
      run: |
        set -euo pipefail
        branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
        scope=branch
        if [ -f "${MODULE}/test/module.yaml" ] && grep -qE '^pin_step:[[:space:]]*true[[:space:]]*$' "${MODULE}/test/module.yaml"; then
          case "${MODULE}" in modules/k8s/*) scope=module ;; *) scope=all ;; esac
        fi
        case "$scope" in
          branch) echo "Waiting for older runs of this workflow on branch ${branch}" ;;
          module) echo "Waiting for older runs of this workflow on branch ${branch} and for older runs testing ${MODULE} on any branch (pinned k8s module)" ;;
          all) echo "Waiting for every older run of this workflow (pinned terraform module, applied inside its regular step)" ;;
        esac
        # older RUN_ID BRANCH lines: the still active runs of this workflow
        # that started before this one.
        older() {
          local status
          for status in in_progress queued waiting; do
            gh api --paginate -X GET "repos/${GITHUB_REPOSITORY}/actions/runs" -f status="$status" -f per_page=100 \
              --jq '.workflow_runs[] | select(.name == $ENV.GITHUB_WORKFLOW and .id < ($ENV.GITHUB_RUN_ID | tonumber)) | "\(.id) \(.head_branch)"'
          done
        }
        # blocks RUN_ID BRANCH: whether that run can collide with this job.
        blocks() {
          [ "$2" = "$branch" ] && return 0
          [ "$scope" = all ] && return 0
          [ "$scope" = module ] || return 1
          local jobs
          jobs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/$1/jobs?per_page=100" --jq '.jobs[] | "\(.status) \(.name)"')
          echo "$jobs" | grep -qE '^completed .*Detect changed modules$' || return 0
          echo "$jobs" | grep -v '^completed ' | grep -qE " / ${MODULE}\$"
        }
        deadline=$((SECONDS + 3600))
        while :; do
          blocking=()
          while read -r id b; do
            [ -n "$id" ] || continue
            if blocks "$id" "$b"; then blocking+=("$id (${b})"); fi
          done < <(older)
          [ ${#blocking[@]} -gt 0 ] || break
          if [ $SECONDS -ge $deadline ]; then
            echo "::error::still waiting for run(s) ${blocking[*]} after an hour" >&2
            exit 1
          fi
          echo "Waiting for ${blocking[*]}"
          sleep 60
        done
        echo "No older run in the way"
    - name: Environment selection
      id: envs
      env:
        ENVIRONMENTS: ${{ inputs.environments }}
        MODULE: ${{ matrix.module }}
      run: |
        set -euo pipefail
        # The environments whose steps list the module (every environment
        # with a cli older than v0.8.6, which ignores the module argument),
        # narrowed to the ones asked for. Only their clouds get credentials
        # and only their clusters a kubeconfig: a module one cloud installs
        # costs one cloud's logins and image pulls. The orchestrator selects
        # for itself in the test step, where an environment whose cloud has
        # no credentials is skipped with a warning rather than failing.
        selected=$(./test.sh envs --tsv "${MODULE}" | cut -f1 | while read -r name; do
          if [ -n "${ENVIRONMENTS}" ]; then
            case ",${ENVIRONMENTS}," in *",${name},"*) ;; *) continue ;; esac
          fi
          echo "$name"
        done | paste -sd,)
        echo "Environments of ${MODULE}: ${selected:-none}"
        echo "environments=${selected}" >> "$GITHUB_OUTPUT"
        args=""
        IFS=, read -r -a envs <<<"${ENVIRONMENTS}"
        for e in "${envs[@]}"; do [ -n "$e" ] && args="$args --env $e"; done
        echo "args=${args}" >> "$GITHUB_OUTPUT"
    - uses: entigolabs/entigo-infralib-test/.github/actions/credentials@main
      if: steps.envs.outputs.environments != ''
      with:
        google_credentials: ${{ secrets.GOOGLE_CREDENTIALS }}
        oci_config: ${{ secrets.OCI_CONFIG }}
        oci_private_key: ${{ secrets.OCI_PRIVATE_KEY }}
        environments: ${{ steps.envs.outputs.environments }}
    - uses: entigolabs/entigo-infralib-test/.github/actions/kubeconfig@main
      if: steps.envs.outputs.environments != ''
      with:
        environments: ${{ steps.envs.outputs.environments }}
    - name: Test ${{ matrix.module }}
      run: ./test.sh ${{ steps.envs.outputs.args }} ${{ matrix.module }}
    - name: go.mod matches the framework version of test.sh
      # The test run aligns go.mod to the image's framework version; a diff
      # here means the framework was bumped in test.sh without committing the
      # go.mod and go.sum that running the tests once would have produced.
      run: |
        if ! git diff --quiet -- go.mod go.sum; then
          git --no-pager diff -- go.mod
          echo "::error::go.mod/go.sum are behind the framework version in test.sh: run ./test.sh once and commit go.mod and go.sum" >&2
          exit 1
        fi
    - name: Logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: logs-${{ strategy.job-index }}
        path: logs/
        if-no-files-found: ignore
