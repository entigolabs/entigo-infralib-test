# Reusable workflow for module repositories: apply main to every environment,
# one job per environment, test it, and when main is ahead of the latest
# release, tag it and create the GitHub release. Optionally also publish the
# modules as OCI packages (charts, modules, SBOMs and a signed index, mirrored
# to every listed registry) and to a release repository (the way
# entigo-infralib-release is made). The release repository predates OCI
# publishing and is not required.
#
#   on:
#     workflow_run:
#       workflows: [Stable]
#       types: [completed]
#     workflow_dispatch:
#   jobs:
#     release:
#       if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
#       uses: entigolabs/entigo-infralib-test/.github/workflows/module-release.yaml@main
#       with:
#         oci_registries: ghcr.io/<org>/<repo>-release,public.ecr.aws/<alias>/<repo>-release   # optional
#         release_repo: https://github.com/<org>/<repo>-release                                # optional
#       secrets: inherit
#
# The version is <release_version.txt>.0 when the file's major.minor moved,
# otherwise the latest release's patch plus one. OCI publishing logs in to
# ghcr.io with the run's token and to public.ecr.aws with the AWS secrets;
# the GitHub release's manifest.json asset is its completion marker.
# With a SLACK_WEBHOOK_URL secret (plus SLACK_USERNAME, SLACK_ICON_EMOJI) a
# failed environment, a failed release and a published release are posted
# to Slack; without it nothing is posted.
# Publishing to release_repo needs the SSH_PRIVATE_KEY secret, a deploy key
# with write access there, and that repository's tag is its marker. A run
# that died after creating the GitHub release resumes what is missing.
name: Module release

on:
  workflow_call:
    inputs:
      oci_registries:
        description: optional comma separated OCI registry paths to publish charts, modules and the signed index to; the first is primary, the rest mirrors
        type: string
        default: ''
      release_repo:
        description: optional git URL (https://github.com/<org>/<repo>) to publish the modules to, without their tests
        type: string
        default: ''

      environments:
        description: comma separated environments to run; empty means every environment with credentials
        type: string
        default: ''
      runs-on:
        type: string
        default: ubuntu-latest

jobs:
  plan:
    name: Environments
    runs-on: ${{ inputs.runs-on }}
    outputs:
      environments: ${{ steps.envs.outputs.environments }}
    env:
      HAS_AWS: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
      HAS_GOOGLE: ${{ secrets.GOOGLE_CREDENTIALS != '' }}
      HAS_ORACLE: ${{ secrets.OCI_CONFIG != '' }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - name: Select environments
      id: envs
      env:
        ENVIRONMENTS: ${{ inputs.environments }}
      run: |
        set -euo pipefail
        selected=$(./test.sh envs --tsv | while IFS=$'\t' read -r name cloud rest; do
          if [ -n "${ENVIRONMENTS}" ]; then
            case ",${ENVIRONMENTS}," in *",${name},"*) ;; *) continue ;; esac
          fi
          case "$cloud" in
            aws) [ "${HAS_AWS}" = true ] && echo "$name" ;;
            google) [ "${HAS_GOOGLE}" = true ] && echo "$name" ;;
            oracle) [ "${HAS_ORACLE}" = true ] && echo "$name" ;;
          esac
        done | jq -r -R -s 'split("\n") | map(select(length > 0)) | map(@json) | join(",")')
        echo "Environments: ${selected}"
        [ -n "${selected}" ] || { echo "::error::no environment has credentials" >&2; exit 1; }
        # No braces or brackets in the output: GitHub drops a job output that
        # contains any line of a multi-line secret, and a JSON credentials
        # secret has lines that are just { or }. The job rebuilds the JSON.
        echo "environments=${selected}" >> "$GITHUB_OUTPUT"

  environment:
    name: ${{ matrix.environment }}
    needs: plan
    runs-on: ${{ inputs.runs-on }}
    strategy:
      matrix:
        environment: ${{ fromJson(format('[{0}]', needs.plan.outputs.environments)) }}
      fail-fast: false
    env:
      HAS_SLACK: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      GOOGLE_PROJECT: ${{ secrets.GOOGLE_PROJECT }}
      GOOGLE_REGION: ${{ secrets.GOOGLE_REGION }}
      GOOGLE_ZONE: ${{ secrets.GOOGLE_ZONE }}
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - name: Wait for other runs on the shared environments
      uses: softprops/turnstyle@v3
      with:
        abort-after-seconds: 3600
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: entigolabs/entigo-infralib-test/.github/actions/credentials@main
      with:
        google_credentials: ${{ secrets.GOOGLE_CREDENTIALS }}
        oci_config: ${{ secrets.OCI_CONFIG }}
        oci_private_key: ${{ secrets.OCI_PRIVATE_KEY }}
    - name: Apply main to ${{ matrix.environment }}
      run: ./test.sh agent --env ${{ matrix.environment }} --source ${{ github.server_url }}/${{ github.repository }} --version main
    - uses: entigolabs/entigo-infralib-test/.github/actions/kubeconfig@main
      with:
        environments: ${{ matrix.environment }}
    - name: Test ${{ matrix.environment }}
      run: ./test.sh test --env ${{ matrix.environment }}
    - name: Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: logs-${{ matrix.environment }}
        path: logs/
        if-no-files-found: ignore
    - name: Slack message
      if: failure() && env.HAS_SLACK == 'true'
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_COLOR: failure
        SLACK_MESSAGE: "Updating from latest release to main failed for ${{ matrix.environment }} in ${{ github.repository }}"
        SLACK_USERNAME: ${{ secrets.SLACK_USERNAME }}
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_ICON_EMOJI: ${{ secrets.SLACK_ICON_EMOJI }}
        SLACK_FOOTER: ""

  release:
    name: Release
    needs: environment
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      HAS_SLACK: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Decide the version
      id: version
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_REPO: ${{ inputs.release_repo }}
        OCI_REGISTRIES: ${{ inputs.oci_registries }}
      run: |
        set -euo pipefail
        release_repo_slug=${RELEASE_REPO#https://github.com/}
        latest=$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName,targetCommitish --jq '.tagName + " " + .targetCommitish' 2>/dev/null || echo "")
        latest_tag=${latest%% *}
        main_sha=$(git rev-parse HEAD)
        wanted=$(tr -d '[:space:]' < release_version.txt)
        if [ -z "$latest_tag" ]; then
          new="v${wanted}.0"; needed=true; exists=false
        else
          latest_sha=$(git rev-list -n1 "$latest_tag" 2>/dev/null || echo "")
          if [ "$latest_sha" = "$main_sha" ]; then
            # main is released; make sure every configured destination got it.
            complete=true
            if [ -n "${RELEASE_REPO}" ] && ! gh api "repos/${release_repo_slug}/git/ref/tags/${latest_tag}" >/dev/null 2>&1; then
              echo "::warning::release ${latest_tag} exists but ${release_repo_slug} has no such tag, resuming its publish"; complete=false
            fi
            if [ -n "${OCI_REGISTRIES}" ] && ! gh release view "${latest_tag}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' | grep -qx manifest.json; then
              echo "::warning::release ${latest_tag} exists but has no manifest.json asset, resuming its OCI publish"; complete=false
            fi
            if [ "$complete" = true ]; then
              needed=false; new="$latest_tag"; exists=true
            else
              needed=true; new="$latest_tag"; exists=true
            fi
          else
            major_minor=$(echo "$latest_tag" | sed -E 's/^v([0-9]+\.[0-9]+)\.[0-9]+$/\1/')
            patch=$(echo "$latest_tag" | sed -E 's/^v[0-9]+\.[0-9]+\.([0-9]+)$/\1/')
            if [ "$major_minor" = "$wanted" ]; then new="v${major_minor}.$((patch + 1))"; else new="v${wanted}.0"; fi
            needed=true; exists=false
          fi
        fi
        echo "latest=${latest_tag} main=${main_sha} new=${new} needed=${needed} exists=${exists}"
        { echo "new=${new}"; echo "oci=${new#v}"; echo "needed=${needed}"; echo "exists=${exists}"; echo "latest=${latest_tag}"; } >> "$GITHUB_OUTPUT"
    - name: Release notes
      # The modules that changed since the previous release, plus the other
      # top-level paths that did (environments, workflows), as a heading
      # before the pull request list that --generate-notes adds.
      id: notes
      env:
        LATEST: ${{ steps.version.outputs.latest }}
      run: |
        set -euo pipefail
        since=${LATEST:-$(git rev-list --max-parents=0 HEAD)}
        # grep exits 1 when nothing matches, which is a valid outcome here.
        modules=$(git diff --name-only "$since" HEAD -- modules | cut -d/ -f1-3 | sort -u | sed 's/^/- /' || true)
        other=$(git diff --name-only "$since" HEAD | { grep -v '^modules/' || true; } | cut -d/ -f1 | sort -u | sed 's/^/- /')
        {
          echo "notes<<EOF"
          echo "## Changed modules"
          echo "${modules:-- none}"
          if [ -n "$other" ]; then echo; echo "## Other changes"; echo "$other"; fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
    - name: Tag and create the GitHub release
      if: steps.version.outputs.needed == 'true' && steps.version.outputs.exists != 'true'
      id: release
      env:
        GH_TOKEN: ${{ github.token }}
        NEW: ${{ steps.version.outputs.new }}
        LATEST: ${{ steps.version.outputs.latest }}
        NOTES: ${{ steps.notes.outputs.notes }}
      run: |
        set -euo pipefail
        git config user.name "GitHub Actions" && git config user.email "actions@github.com"
        git tag -a "$NEW" -m "Release $NEW" -m "$NOTES"
        git push origin "$NEW"
        notes_args=(--generate-notes)
        [ -n "$LATEST" ] && notes_args+=(--notes-start-tag "$LATEST")
        url=$(gh release create "$NEW" --title "Release $NEW" "${notes_args[@]}" --notes "$NOTES" --latest)
        echo "url=$url" >> "$GITHUB_OUTPUT"
    - name: Publish OCI packages
      if: steps.version.outputs.needed == 'true' && inputs.oci_registries != ''
      id: oci
      uses: entigolabs/entigo-infralib-test/.github/actions/oci-publish@main
      with:
        registries: ${{ inputs.oci_registries }}
        version: ${{ steps.version.outputs.oci }}
        out: ${{ runner.temp }}/oci-publish
    - name: Attach manifest and index to the release
      if: steps.version.outputs.needed == 'true' && inputs.oci_registries != ''
      env:
        GH_TOKEN: ${{ github.token }}
        NEW: ${{ steps.version.outputs.new }}
      run: gh release upload "$NEW" --repo "${GITHUB_REPOSITORY}" --clobber "${RUNNER_TEMP}/oci-publish/manifest.json" "${RUNNER_TEMP}"/oci-publish/index-*.zip
    - name: Publish to ${{ inputs.release_repo }}
      if: steps.version.outputs.needed == 'true' && inputs.release_repo != ''
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        RELEASE_REPO: ${{ inputs.release_repo }}
        NEW: ${{ steps.version.outputs.new }}
        NOTES: ${{ steps.notes.outputs.notes }}
      run: |
        set -euo pipefail
        [ -n "${SSH_PRIVATE_KEY}" ] || { echo "::error::SSH_PRIVATE_KEY secret (deploy key with write access to ${RELEASE_REPO}) is not set" >&2; exit 1; }
        mkdir -p ~/.ssh && echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_release && chmod 600 ~/.ssh/id_release
        ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
        export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_release -o IdentitiesOnly=yes"
        slug=${RELEASE_REPO#https://github.com/}
        git clone "git@github.com:${slug}.git" "${RUNNER_TEMP}/release"
        # Modules only, without their tests: the release is what the agent consumes.
        rsync -a --delete --exclude 'test' --exclude 'test.sh' modules/ "${RUNNER_TEMP}/release/modules/"
        [ -f LICENSE.txt ] && cp LICENSE.txt "${RUNNER_TEMP}/release/"
        cd "${RUNNER_TEMP}/release"
        git config user.name "GitHub Actions" && git config user.email "actions@github.com"
        git add --all
        if git diff --cached --quiet; then
          echo "Nothing to commit, files already match ${NEW}"
        else
          git commit -m "Release ${NEW}" -m "${NOTES}" -m "Published from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git push
        fi
        if git rev-parse -q --verify "refs/tags/${NEW}" >/dev/null; then
          echo "Tag ${NEW} already exists in ${slug}"
        else
          git tag -a "${NEW}" -m "Release ${NEW}" -m "${NOTES}"
          git push origin "${NEW}"
        fi
        echo "Published ${NEW} to ${RELEASE_REPO}"
    - name: Slack message
      if: success() && steps.version.outputs.needed == 'true' && steps.version.outputs.exists != 'true' && env.HAS_SLACK == 'true'
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_COLOR: good
        SLACK_MESSAGE: "Released ${{ steps.version.outputs.new }} of ${{ github.repository }} ${{ steps.release.outputs.url }}\n${{ steps.notes.outputs.notes }}"
        SLACK_USERNAME: ${{ secrets.SLACK_USERNAME }}
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_ICON_EMOJI: ${{ secrets.SLACK_ICON_EMOJI }}
        SLACK_FOOTER: ""
    - name: Slack message
      if: failure() && env.HAS_SLACK == 'true'
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_COLOR: failure
        SLACK_MESSAGE: "Releasing a new version of ${{ github.repository }} failed"
        SLACK_USERNAME: ${{ secrets.SLACK_USERNAME }}
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_ICON_EMOJI: ${{ secrets.SLACK_ICON_EMOJI }}
        SLACK_FOOTER: ""
