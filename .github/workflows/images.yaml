# Builds the per-cloud test images from this repository:
#   pull request  -> entigolabs/entigo-infralib-test-<cloud>:dev
#   push to main  -> entigolabs/entigo-infralib-test-<cloud>:latest
#   tag vX.Y.Z    -> entigolabs/entigo-infralib-test-<cloud>:vX.Y.Z (and latest)
#
# The images build FROM entigolabs/entigo-infralib-<cloud>:latest, the agent
# images published by entigo-infralib, so a new agent or tool version reaches
# the test images on the next build here. Nothing cascades automatically yet;
# re-run this workflow (workflow_dispatch) to pick a new base up.
name: Images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: images-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.cloud }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cloud: [aws, google, oracle]
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Resolve tags
      id: tags
      run: |
        set -euo pipefail
        name="entigolabs/entigo-infralib-test-${{ matrix.cloud }}"
        case "${GITHUB_EVENT_NAME}:${GITHUB_REF}" in
          pull_request:*)        tags="${name}:dev" ;;
          *:refs/tags/v*)        tags="${name}:${GITHUB_REF_NAME},${name}:latest" ;;
          *:refs/heads/main)     tags="${name}:latest" ;;
          *) echo "Refusing to publish from ${GITHUB_REF}" >&2; exit 1 ;;
        esac
        echo "tags=${tags}" >> "$GITHUB_OUTPUT"
        echo "Publishing ${tags}"

    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: images/${{ matrix.cloud }}/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.tags.outputs.tags }}
        provenance: mode=max
        sbom: true
        cache-from: type=gha,scope=${{ matrix.cloud }}
        cache-to: type=gha,scope=${{ matrix.cloud }},mode=max
