# Reusable workflow for module repositories: after a merge to main, apply the
# modules the push changed to the regular installation of every environment
# (under their regular names, not the per-branch copies a pull request used)
# and test them again. Only the changed modules are applied: a pinned module
# that someone is still testing from a pull request is not put back to main
# by an unrelated merge. Nothing is tagged or released here;
# module-release.yaml does that.
#
#   on:
#     push:
#       branches: [main]
#       paths: ['modules/**', 'environments/**']
#   jobs:
#     main:
#       uses: entigolabs/entigo-infralib-test/.github/workflows/module-main.yaml@main
#       secrets: inherit
#
# When the push changed no module (an environment file, say) every step is
# applied from main and every module's tests run, since such a change can
# affect any of them. Credentials as in module-pull-request.yaml.
name: Module main

on:
  workflow_call:
    inputs:
      modules:
        description: JSON list of module directories to test; empty means the ones the push changed, or all when it changed none
        type: string
        default: ''
      environments:
        description: comma separated environments to run; empty means every environment with credentials
        type: string
        default: ''
      runs-on:
        type: string
        default: ubuntu-latest

jobs:
  plan:
    name: Environments and modules
    runs-on: ${{ inputs.runs-on }}
    outputs:
      environments: ${{ steps.envs.outputs.environments }}
      modules: ${{ steps.modules.outputs.modules }}
    env:
      HAS_AWS: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
      HAS_GOOGLE: ${{ secrets.GOOGLE_CREDENTIALS != '' }}
      HAS_ORACLE: ${{ secrets.OCI_CONFIG != '' }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Select environments
      id: envs
      env:
        ENVIRONMENTS: ${{ inputs.environments }}
      run: |
        set -euo pipefail
        selected=$(./test.sh envs --tsv | while IFS=$'\t' read -r name cloud rest; do
          if [ -n "${ENVIRONMENTS}" ]; then
            case ",${ENVIRONMENTS}," in *",${name},"*) ;; *) continue ;; esac
          fi
          case "$cloud" in
            aws) [ "${HAS_AWS}" = true ] && echo "$name" ;;
            google) [ "${HAS_GOOGLE}" = true ] && echo "$name" ;;
            oracle) [ "${HAS_ORACLE}" = true ] && echo "$name" ;;
          esac
        done | jq -r -R -s 'split("\n") | map(select(length > 0)) | map(@json) | join(",")')
        echo "Environments: ${selected}"
        [ -n "${selected}" ] || { echo "::error::no environment has credentials" >&2; exit 1; }
        # No braces or brackets in the output: GitHub drops a job output that
        # contains any line of a multi-line secret, and a JSON credentials
        # secret has lines that are just { or }. The job rebuilds the JSON.
        echo "environments=${selected}" >> "$GITHUB_OUTPUT"
    - name: Changed files
      id: changed
      if: inputs.modules == '' && github.event_name == 'push'
      uses: tj-actions/changed-files@v45
    - name: Modules to test
      id: modules
      env:
        INPUT_MODULES: ${{ inputs.modules }}
        CHANGED: ${{ steps.changed.outputs.all_changed_files }}
      run: |
        set -euo pipefail
        if [ -n "${INPUT_MODULES}" ]; then
          modules=$(echo "${INPUT_MODULES}" | jq -r 'join(" ")')
        else
          modules=$(for f in ${CHANGED}; do
              case "$f" in modules/*/*/*) echo "$f" | cut -d/ -f1-3 ;; esac
            done | sort -u | while read -r m; do
              ls "$m"/test/*_test.go >/dev/null 2>&1 && echo "$m"
            done | tr '\n' ' ')
        fi
        echo "Modules to test: ${modules:-all}"
        echo "modules=${modules}" >> "$GITHUB_OUTPUT"

  environment:
    name: ${{ matrix.environment }}
    needs: plan
    runs-on: ${{ inputs.runs-on }}
    strategy:
      matrix:
        environment: ${{ fromJson(format('[{0}]', needs.plan.outputs.environments)) }}
      fail-fast: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      GOOGLE_PROJECT: ${{ secrets.GOOGLE_PROJECT }}
      GOOGLE_REGION: ${{ secrets.GOOGLE_REGION }}
      GOOGLE_ZONE: ${{ secrets.GOOGLE_ZONE }}
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
    steps:
    - uses: actions/checkout@v4
    - name: Wait for other runs on the shared environments
      uses: softprops/turnstyle@v3
      with:
        abort-after-seconds: 3600
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: entigolabs/entigo-infralib-test/.github/actions/credentials@main
      with:
        google_credentials: ${{ secrets.GOOGLE_CREDENTIALS }}
        oci_config: ${{ secrets.OCI_CONFIG }}
        oci_private_key: ${{ secrets.OCI_PRIVATE_KEY }}
    - name: Apply main to ${{ matrix.environment }}
      # The changed modules are applied under their regular names; nothing
      # else is touched. Without changed modules every step runs, so that
      # changes outside modules/ are applied too. The modules come from the
      # repository's main branch, not from the checkout: a mounted path ends
      # up as a file:// source in the ArgoCD Applications, which only works
      # while the repo-server pod that received it is alive. Paths are for
      # pull requests and local runs.
      env:
        MODULES: ${{ needs.plan.outputs.modules }}
        SOURCE: ${{ github.server_url }}/${{ github.repository }}
      run: |
        if [ -n "${MODULES}" ]; then
          ./test.sh agent --in-place --env ${{ matrix.environment }} --source "${SOURCE}" --version main ${MODULES}
        else
          ./test.sh agent --env ${{ matrix.environment }} --source "${SOURCE}" --version main
        fi
    - uses: entigolabs/entigo-infralib-test/.github/actions/kubeconfig@main
      with:
        environments: ${{ matrix.environment }}
    - name: Test ${{ matrix.environment }}
      run: ./test.sh test --env ${{ matrix.environment }} ${{ needs.plan.outputs.modules }}
    - name: Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: logs-${{ matrix.environment }}
        path: logs/
        if-no-files-found: ignore

  main:
    name: Main
    needs: environment
    runs-on: ${{ inputs.runs-on }}
    steps:
    - run: echo "main is applied and tested on every environment"
